<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>スプラドラフト会議</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#06162b">
<style>
  /* Layout: オールール杯データページと同じ濃紺ポータル。sticky ヘッダー → ヒーロー＋facts → 指名中バナー → 選手プール｜チームカード → フッター */
  :root {
    color-scheme: dark;
    --bg: #06162b;
    --surface: #0b1e38;
    --surface-2: #112848;
    --line: #1f3a60;
    --fg: #eef3fb;
    --fg-2: #a9b8cf;
    --fg-3: #6f83a1;
    --accent: #e9f24a;
    --accent-ink: #06162b;
    --down: #ff8a66;
    --f-display: "Hiragino Sans", "Meiryo", sans-serif;
    --f-body: "Hiragino Sans", "Meiryo", sans-serif;
    --f-num: "Hiragino Sans", "Meiryo", sans-serif;
    --radius: 14px;
  }
  * { box-sizing: border-box }
  @media (prefers-reduced-motion:reduce) { * { transition: none !important; animation: none !important } }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.7;
    background-image: radial-gradient(circle at 12% -10%, rgba(57,135,229,.18), transparent 40%), radial-gradient(circle at 95% 8%, rgba(233,242,74,.08), transparent 35%);
    background-repeat: no-repeat
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top,0px); z-index: 10; background: rgba(6,22,43,.92) }
  .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)) }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

  /* header */
  .site-head { position: sticky; top: env(safe-area-inset-top,0px); z-index: 20; background: rgba(6,22,43,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line) }
  .site-head .wrap { display: flex; align-items: center; gap: 20px; padding-block: 12px; flex-wrap: wrap }
  .brand { display: flex; flex-direction: column; line-height: 1.1; text-decoration: none; color: inherit }
  .brand b { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: .02em }
  .brand small { font-family: var(--f-num); font-size: 10.5px; letter-spacing: .22em; color: var(--accent) }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line) }
  .tabs span { font-weight: 800; font-size: 14px; padding: 6px 16px; border-radius: 999px; color: var(--fg-3) }
  .tabs span.on { background: var(--accent); color: var(--accent-ink) }
  .head-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap }

  /* section scaffolding */
  .eyebrow { font-family: var(--f-num); font-weight: 700; font-size: 12.5px; letter-spacing: .14em; color: var(--accent); display: flex; align-items: center; gap: 10px }
  .eyebrow::after { content: ""; height: 2px; width: 36px; background: var(--accent); border-radius: 2px }
  h1, h2, h3 { font-family: var(--f-display); font-weight: 800; text-wrap: balance; margin: 0 }
  h2 { font-size: clamp(20px, 2.6vw, 26px); line-height: 1.3 }
  .lead { color: var(--fg-2); margin: 0 }
  .hero { padding-block: 44px 8px }
  .hero h1 { font-size: clamp(30px, 5.4vw, 52px); line-height: 1.15; margin: 10px 0 12px }
  .hero h1 em { font-style: normal; color: var(--accent) }
  .hero p.sub { color: var(--fg-2); font-size: 16px; margin: 0 }
  .facts { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 26px 0 30px; padding: 16px 0; border-block: 1px solid var(--line) }
  .fact { display: flex; align-items: baseline; gap: 8px }
  .fact .n { font-family: var(--f-num); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums }
  .fact .l { color: var(--fg-2); font-size: 13px; font-weight: 700 }

  /* controls (データページと共通) */
  .seg { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
  .seg .lab { font-size: 12px; font-weight: 700; color: var(--fg-3); margin-right: 4px; letter-spacing: .06em }
  .chip { font: inherit; font-size: 13.5px; font-weight: 700; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px }
  .chip:hover { color: var(--fg); border-color: var(--fg-3) }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
  .more { font: inherit; font-size: 14px; font-weight: 700; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 24px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px }
  .more:hover { border-color: var(--fg-3); background: var(--surface-2) }
  .more.sm { padding: 6px 16px; font-size: 13.5px }
  .more.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
  .more.primary:hover { filter: brightness(1.06) }
  .more.armed { background: var(--down); color: var(--accent-ink); border-color: var(--down) }
  .more:disabled, .chip:disabled { opacity: .4; cursor: not-allowed }

  /* panels */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 18px; min-width: 0 }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
  .h4 { font-size: 12.5px; font-weight: 700; color: var(--fg-3); letter-spacing: .1em; margin: 0 }
  .field { display: grid; gap: 8px; min-width: 0 }
  input[type=text], select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0 }
  input[type=text]:hover, select:hover, textarea:hover { border-color: var(--fg-3) }
  textarea { width: 100%; min-height: 210px; resize: vertical; line-height: 1.75 }
  .setup-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px }
  .opts { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center }
  .team-rows { display: grid; gap: 8px }
  .team-row { display: grid; grid-template-columns: 34px minmax(0,1fr) minmax(0,1fr); gap: 8px; align-items: center }
  .swatch { width: 34px; height: 34px; border-radius: 50% 46% 52% 44%; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--line); padding: 0; cursor: pointer }
  .hint { font-size: 12.5px; color: var(--fg-3); margin: 0 }
  .error { color: var(--down); font-weight: 700; font-size: 13px; margin: 0 }
  .badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--fg-2); border: 1px solid var(--line); background: var(--surface-2); padding: 2px 10px; border-radius: 999px }
  .check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; color: var(--fg-2); cursor: pointer }
  .check input { accent-color: var(--accent); width: 16px; height: 16px }

  /* 指名中バナー */
  .clock { border-radius: var(--radius); padding: 20px 22px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; position: relative; overflow: hidden; isolation: isolate }
  .clock::after { content: ""; position: absolute; right: -24px; top: -46px; width: 200px; height: 170px; background: currentColor; opacity: .09; border-radius: 58% 42% 61% 39% / 45% 55% 45% 55%; z-index: -1 }
  .clock .who { display: grid; gap: 2px }
  .clock .who small { font-family: var(--f-num); font-size: 12px; font-weight: 700; letter-spacing: .14em; opacity: .8 }
  .clock .who strong { font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 4vw, 32px); line-height: 1.2 }
  .clock .count { font-family: var(--f-num); font-weight: 700; font-size: clamp(30px, 5vw, 46px); line-height: 1; font-variant-numeric: tabular-nums }
  .clock .count small { font-size: 13px; margin-left: 6px }
  .strip { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 12px }
  .strip .tick { width: 26px; height: 26px; border-radius: 50% 44% 52% 46%; display: grid; place-items: center; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: .3 }
  .strip .tick.done { opacity: .85 }
  .strip .tick.now { opacity: 1; outline: 2px solid var(--fg); outline-offset: 2px }
  .strip .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px }

  .board { display: grid; grid-template-columns: minmax(0,5fr) minmax(0,7fr); gap: 20px; align-items: start; margin-top: 24px }
  .pool { display: flex; flex-wrap: wrap; gap: 8px }
  .pick { font: inherit; color: var(--fg); display: inline-grid; text-align: left; border-radius: 12px; padding: 8px 14px; background: var(--bg); border: 1px solid var(--line); line-height: 1.35; cursor: pointer; transition: border-color .15s, background .15s }
  .pick:hover { border-color: var(--hov, var(--accent)); background: var(--surface-2) }
  .pick b { font-size: 15px }
  .pick i { font-style: normal; font-size: 11.5px; color: var(--fg-3) }
  .pick:disabled { cursor: default }
  .pick:disabled:hover { border-color: var(--line); background: var(--bg) }

  .teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px }
  .team { border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s }
  .team.on { box-shadow: 0 0 0 2px var(--tc), 0 8px 30px -10px var(--tc) }
  .team h3 { font-size: 17px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px }
  .team h3 small { font-family: var(--f-num); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums }
  .team ol { list-style: none; margin: 0; padding: 10px 16px 14px; display: grid; gap: 7px }
  .team li { display: flex; gap: 8px; align-items: baseline; min-width: 0; flex-wrap: wrap }
  .team li .no { font-size: 11px; font-weight: 700; color: var(--fg-3); width: 34px; flex: none; font-variant-numeric: tabular-nums }
  .team li .nm { font-weight: 700; overflow-wrap: anywhere }
  .team li .nt { font-size: 11.5px; color: var(--fg-3) }
  .team li.empty .nm { color: var(--line); font-weight: 400 }
  .cap { font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); letter-spacing: .05em }
  .result { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13.5px; margin: 0; overflow-x: auto; font-family: inherit }
  .toast { font-size: 13px; font-weight: 700; color: var(--accent) }

  footer { margin-top: 64px; border-top: 1px solid var(--line) }
  footer .wrap { padding-block: 24px 36px; color: var(--fg-3); font-size: 12.5px; display: flex; flex-direction: column; gap: 6px }

  @media (max-width:760px) { .setup-grid, .board { grid-template-columns: minmax(0,1fr) } .head-actions { margin-left: 0 } }
  @media (prefers-reduced-motion:no-preference) { .team li.new { animation: pop .35s ease-out } @keyframes pop { from { transform: translateX(-6px); opacity: 0 } to { transform: none; opacity: 1 } } }
  /* ===== 追加：選手カード・武器アイコン ===== */
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--fg-2) }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3) }
  .status.live .dot { background: #19c483 }
  .status.warn .dot { background: var(--down) }
  .status.load .dot { background: var(--accent); animation: blink 1s infinite }
  @keyframes blink { 50% { opacity: .3 } }
  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px }
  .pcard { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0 }
  .pcard.cap { border-color: var(--accent) }
  .phead { display: flex; gap: 12px; align-items: center; min-width: 0 }
  .phead .pn { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; line-height: 1.3 }
  .phead .pn small { display: block; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .08em }
  .av { flex: none; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; font-weight: 800; color: var(--fg-2) }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block }
  .av.l { width: 52px; height: 52px; font-size: 20px }
  .av.m { width: 38px; height: 38px; font-size: 15px }
  .av.s { width: 28px; height: 28px; font-size: 12px }
  .wlist { display: grid; gap: 6px }
  .wrow { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 8px; align-items: center; background: var(--surface); border-radius: 10px; padding: 4px 8px 4px 4px }
  .wrow .wi { width: 38px; height: 38px; object-fit: contain }
  .wrow .wn { font-size: 13px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere }
  .wrow .wn small { display: block; font-size: 10.5px; color: var(--fg-3); font-weight: 700 }
  .wrow .ks { display: flex; gap: 4px }
  .kit { width: 24px; height: 24px; border-radius: 6px; background: var(--surface-2); padding: 2px; object-fit: contain }
  .wnone { font-size: 12.5px; color: var(--fg-3) }
  .pr { font-size: 13px; color: var(--fg-2); margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65 }
  .pr.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
  .note { font-size: 12.5px; color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 }
  .note b { color: var(--accent) }

  /* 指名カード（ドラフト中のプール） */
  .pool.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
  .pick.card2 { display: grid; gap: 8px; padding: 10px 12px; border-radius: 12px; align-content: start; min-width: 0 }
  .pick.card2 .top { display: flex; gap: 10px; align-items: center; min-width: 0 }
  .pick.card2 .top b { font-size: 15px; overflow-wrap: anywhere; line-height: 1.3 }
  .mini { display: flex; gap: 6px; flex-wrap: wrap }
  .mw { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 8px; padding: 2px 5px 2px 2px }
  .mw .wi { width: 30px; height: 30px; object-fit: contain }
  .mw .kit { width: 18px; height: 18px; padding: 1px; border-radius: 4px }
  .team li .mini { margin-left: auto }
  .team li .mw { padding: 1px 3px 1px 1px; background: var(--surface-2) }
  .team li .mw .wi { width: 24px; height: 24px }
  .team li .mw .kit { display: none }
  .team li { align-items: center }

  /* 準備タブの選手リスト */
  .plist { display: grid; border-top: 1px solid var(--line) }
  .prow { display: grid; grid-template-columns: 34px minmax(140px, 1.1fr) minmax(0, 2.6fr) minmax(0, 2fr); gap: 14px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line) }
  .prow.phd { font-size: 11.5px; font-weight: 700; color: var(--fg-3); letter-spacing: .1em; padding-block: 8px }
  .prow:not(.phd):hover { background: var(--surface-2) }
  .pno { font-size: 12px; font-weight: 700; color: var(--fg-3); text-align: right; font-variant-numeric: tabular-nums }
  .pwho { display: flex; gap: 10px; align-items: center; min-width: 0 }
  .pwho .pn { font-weight: 800; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere }
  .pwho .pn small { display: block; font-size: 10.5px; color: var(--accent); letter-spacing: .1em }
  .prow.cap .pno { color: var(--accent) }
  .pweap { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0 }
  .wchip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px 6px 2px 2px; min-width: 0 }
  .wchip .wi { width: 30px; height: 30px; object-fit: contain }
  .wchip .wn { font-size: 12.5px; font-weight: 700; margin-right: 2px }
  .wchip .kit { width: 20px; height: 20px }
  .wchip.unk { padding: 6px 10px; font-size: 12.5px; color: var(--fg-2); border-style: dashed }
  .ppr { font-size: 13px; color: var(--fg-2); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0 }
  @media (max-width: 760px) {
    .prow { grid-template-columns: 26px minmax(0, 1fr); gap: 8px 10px }
    .prow.phd { display: none }
    .pweap, .ppr { grid-column: 2 }
  }

  /* 同時指名・抽選 */
  .nomrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px }
  .nomrow #reveal { margin-left: auto }
  .nomchip { font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--fg-2); font-size: 13px; font-weight: 700 }
  .nomchip .sw { width: 14px; height: 14px; border-radius: 50%; background: var(--tc) }
  .nomchip b { color: var(--fg); font-weight: 800 }
  .nomchip.on { border-color: var(--tc); box-shadow: 0 0 0 2px var(--tc) }
  .team.selectable { cursor: pointer }
  .team.selectable:hover { border-color: var(--fg-3) }
  .pick.mine { border-color: var(--hov); box-shadow: 0 0 0 2px var(--hov) }
  .nb { display: inline-flex; gap: 3px; margin-left: auto }
  .nb i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--bg) }
  .clock.alt { background: var(--surface-2); color: var(--fg); border: 1px solid var(--accent) }
  .lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px }
  .lot { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; align-content: start }
  .lot-p { display: flex; gap: 12px; align-items: center }
  .lot-p b { display: block; font-size: 17px; margin-bottom: 4px }
  .lot-t { display: flex; flex-wrap: wrap; gap: 8px }
  .lt { font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--tc); background: transparent; color: var(--fg); display: grid; text-align: center; line-height: 1.3; transition: background .08s }
  .lt small { font-size: 11px; font-weight: 700 }
  .lt.hi, .lt.win { background: var(--tc); color: var(--tf) }
  .lt.win { box-shadow: 0 0 0 3px var(--accent) }
  .lt.lose { opacity: .4 }
  .lt:disabled { cursor: default }

  /* 指名発表 */
  .ann { display: grid; gap: 16px; margin-top: 20px }
  .ann-next { border-radius: var(--radius); padding: 26px 24px; background: var(--tc, var(--surface-2)); color: var(--tf, var(--fg)); display: grid; gap: 10px; justify-items: start; position: relative; overflow: hidden; isolation: isolate }
  .ann-next::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 240px; height: 200px; background: currentColor; opacity: .08; border-radius: 58% 42% 61% 39% / 45% 55% 45% 55%; z-index: -1 }
  .ann-next.done { border: 1px solid var(--accent) }
  .ann-next p { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .1em; opacity: .85 }
  .ann-next strong { font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 4.4vw, 40px); line-height: 1.2 }
  .ann-next strong small { font-size: .55em; margin-left: 4px }
  .ann-next .more.primary { background: var(--bg); color: var(--fg); border-color: var(--bg); margin-top: 6px }
  .ann-next.done .more.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
  .ann-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px }
  .ann-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden }
  .ann-team { background: var(--tc); color: var(--tf); font-weight: 800; padding: 8px 14px; display: flex; justify-content: space-between; gap: 8px }
  .ann-team small { font-weight: 700; opacity: .8 }
  .ann-p { display: flex; gap: 12px; align-items: center; padding: 14px; position: relative }
  .ann-p b { display: block; font-size: 20px; line-height: 1.2; margin-bottom: 4px }
  .dup { position: absolute; top: 10px; right: 10px; background: var(--down); color: var(--accent-ink); font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 999px }
  @media (prefers-reduced-motion: no-preference) {
    .ann-card.opening { animation: annIn .5s ease-out both }
    
    
    @keyframes annIn { from { transform: scale(.98) } to { transform: none } }
    @keyframes annP { from { filter: blur(10px); opacity: 0 } to { filter: none; opacity: 1 } }
    @keyframes dupIn { from { transform: scale(1.8); opacity: 0 } to { transform: none; opacity: 1 } }
  }

  /* ルーレット */
  .wheel { width: 100%; max-width: 260px; justify-self: center; overflow: visible }
  .wheel .sg.l { opacity: .3 }
  .lot { justify-items: stretch }
  .lot > [data-spin] { justify-self: center }
  .lot-win { margin: 0; text-align: center; font-weight: 800; font-size: 16px }
  .lot-win span { background: var(--tc); color: var(--tf); padding: 2px 10px; border-radius: 8px; margin-right: 4px }
  .manual { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; border-top: 1px solid var(--line); padding-top: 10px }
  .manual .lab { font-size: 11.5px; font-weight: 700; color: var(--fg-3); width: 100%; text-align: center }
  .manual .lt { padding: 4px 10px; font-size: 12.5px; border-width: 1px }

  /* スロット */
  .slot { position: relative; height: 192px; overflow: hidden; border-radius: 14px; background: var(--bg); border: 2px solid var(--line); box-shadow: inset 0 0 0 4px var(--surface) }
  .slot::before, .slot::after { content: ""; position: absolute; left: 0; right: 0; height: 64px; z-index: 2; pointer-events: none }
  .slot::before { top: 0; background: linear-gradient(var(--bg), transparent) }
  .slot::after { bottom: 0; background: linear-gradient(transparent, var(--bg)) }
  .reel { will-change: transform }
  .srow { height: 64px; display: grid; place-content: center; text-align: center; background: var(--tc); color: var(--tf); font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1.15; border-bottom: 2px solid var(--bg) }
  .srow small { font-family: var(--f-body); font-size: 11px; font-weight: 700; opacity: .8 }
  .slot.run .reel { filter: blur(.6px) }
  .slot.stopped .srow.l { opacity: .25 }
  .slot-line { position: absolute; left: -2px; right: -2px; top: 64px; height: 64px; border: 3px solid var(--accent); border-radius: 8px; z-index: 3; pointer-events: none; box-shadow: 0 0 18px rgba(233,242,74,.35) }
  .slot.stopped .slot-line { animation: winPulse 1s ease-out 2 }
  @keyframes winPulse { 50% { box-shadow: 0 0 34px rgba(233,242,74,.8) } }

  /* 幕 */
  .ann-card.next { box-shadow: 0 0 0 2px var(--tc) }
  .ann-stage { position: relative; overflow: hidden; min-height: 96px }
  .ann-hidden { font-size: 28px; font-weight: 800; color: var(--line) }
  .curtain { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 2;
    background: repeating-linear-gradient(90deg, #7a1424 0 10px, #9c1d30 10px 18px, #6a0f1e 18px 26px);
    box-shadow: inset 0 -10px 18px rgba(0,0,0,.35) }
  .curtain::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: repeating-linear-gradient(90deg, #c9a227 0 6px, #e9c74a 6px 12px) }
  .curtain.l { left: 0; border-right: 1px solid rgba(0,0,0,.4) }
  .curtain.r { right: 0; border-left: 1px solid rgba(0,0,0,.4) }
  .ann-label { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; color: #f5e6c8; font-weight: 800; font-size: 13px; letter-spacing: .12em; text-shadow: 0 1px 4px rgba(0,0,0,.6) }
  .ann-card.opened .curtain { display: none }
  .ann-card.opening .curtain.l { animation: curL 1.6s cubic-bezier(.6,.05,.3,1) .2s both }
  .ann-card.opening .curtain.r { animation: curR 1.6s cubic-bezier(.6,.05,.3,1) .2s both }
  @keyframes curL { 0% { transform: none } 12% { transform: translateX(3%) } 100% { transform: translateX(-102%) } }
  @keyframes curR { 0% { transform: none } 12% { transform: translateX(-3%) } 100% { transform: translateX(102%) } }
  .ann-card.opening .ann-p { animation: annP 1s .9s ease-out both }
  @media (prefers-reduced-motion: reduce) { .ann-card.opening .curtain { display: none } }

  /* 重複は幕が開き切り、名前が見えてから */
  .dup.late { animation: dupIn .45s 2.3s ease-out both }
  @media (prefers-reduced-motion: reduce) { .dup.late { animation: none } }

  /* ドラフト画面：チーム表を上、選手プールを下に */
  .board { grid-template-columns: minmax(0, 1fr) }
  .board > .teams { order: -1 }

  /* 観客用画面 */
  body.aud #app { pointer-events: none }
  body.aud .pick.view { cursor: default }
  .nomchip.ok b { color: var(--accent) }
  .lot-wait { margin: 0; text-align: center; font-weight: 800; color: var(--fg-2); letter-spacing: .1em }
  .aud-btn { border-color: var(--accent); color: var(--accent) }
  /* 最後の幕が開き切ってから、まとめ（重複の件数）を出す */
  .ann-next.done.wait { animation: fadeUp .5s 2.3s ease-out both }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  /* 選手プール：武器3つを1行に収める */
  .pool.cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) }
  .pick.card2 .mini { flex-wrap: nowrap; gap: 5px }
  .pick.card2 .mw { padding: 2px 4px 2px 2px; gap: 1px; flex: none }
  .pick.card2 .mw .wi { width: 28px; height: 28px }
  .pick.card2 .mw .kit { width: 17px; height: 17px }
  @media (max-width: 400px) { .pool.cards { grid-template-columns: minmax(0, 1fr) } }

  /* ===== ドラフト中は1画面に収まるよう詰める ===== */
  body.drafting .wrap { max-width: 1440px }
  body.drafting .hero { padding-block: 12px 0 }
  body.drafting .hero .eyebrow { font-size: 11px }
  body.drafting .hero h1 { font-size: clamp(20px, 2.2vw, 26px); margin: 2px 0 0 }
  body.drafting #heroSub { display: none }
  body.drafting .facts { margin: 8px 0 10px; padding: 6px 0; gap: 4px 22px }
  body.drafting .fact .n { font-size: 18px }
  body.drafting .fact .l { font-size: 12px }
  body.drafting .clock { padding: 10px 16px; gap: 10px }
  body.drafting .clock::after { display: none }
  body.drafting .clock .who small { font-size: 11px }
  body.drafting .clock .who strong { font-size: clamp(17px, 2vw, 22px) }
  body.drafting .clock .count { font-size: clamp(22px, 2.6vw, 30px) }
  body.drafting .nomrow { margin-top: 8px; gap: 6px }
  body.drafting .nomchip { padding: 4px 10px 4px 6px; font-size: 12.5px }
  body.drafting .board { gap: 12px; margin-top: 12px }
  body.drafting .teams { gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)) }
  body.drafting .team h3 { font-size: 14.5px; padding: 5px 12px }
  body.drafting .team ol { padding: 6px 12px 8px; gap: 3px }
  body.drafting .team li { font-size: 14px; gap: 6px }
  body.drafting .team .av.s { width: 24px; height: 24px; font-size: 11px }
  body.drafting .team li .mw .wi { width: 22px; height: 22px }
  body.drafting .board > .panel { padding: 12px 14px; gap: 8px }
  body.drafting .board > .panel h2 { font-size: 17px }
  body.drafting .board > .panel .hint { font-size: 11.5px }
  body.drafting .lots { gap: 10px }
  body.drafting .ann { margin-top: 12px; gap: 12px }
  body.drafting .ann-next { padding: 16px 20px; gap: 6px }
  body.drafting .ann-next strong { font-size: clamp(22px, 3vw, 32px) }

  /* 選手プールのカード（横長・2段） */
  .pool.cards { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px }
  .pick.card2.v2 { grid-template-columns: 38px minmax(0, 1fr); column-gap: 10px; align-items: center; padding: 8px 10px }
  .pick.card2.v2 .pbody { display: grid; gap: 3px; min-width: 0 }
  .pick.card2.v2 .pname { display: flex; align-items: center; gap: 6px; min-width: 0 }
  .pick.card2.v2 .pname b { font-size: 14.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .pick.card2.v2 .pr.one { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4 }
  @media (max-width: 400px) { .pool.cards { grid-template-columns: minmax(0, 1fr) } }
  /* 見出しと数字を1行に */
  body.drafting .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 24px; align-items: end; padding-bottom: 10px }
  body.drafting .hero .eyebrow { grid-column: 1 }
  body.drafting .hero h1 { grid-column: 1 }
  body.drafting .hero .facts { grid-column: 2; grid-row: 1 / span 2; margin: 0; padding: 0; border: 0; justify-content: flex-end }
  @media (max-width: 760px) { body.drafting .hero { grid-template-columns: minmax(0, 1fr) } body.drafting .hero .facts { grid-column: 1; grid-row: auto; justify-content: flex-start; margin-top: 6px } }

  /* 帯：見出しのすぐ右に件数を並べる（例：指名受付中　4 / 4 チーム指名済み） */
  body.drafting .clock { justify-content: flex-start; align-items: flex-end; column-gap: 20px }
  body.drafting .clock .count { font-size: clamp(18px, 2vw, 24px); line-height: 1.2 }
  body.drafting .clock .count small { font-size: 13px; margin-left: 4px }
</style>

let roster = [];                      // 読み込んだ選手
let rosterState = { kind: "loading", msg: "スプレッドシートから選手を読み込んでいます…", at: null };
let resetArmed = false, lastPick = null, toastMsg = "", openPR = new Set();

function load() { try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null } catch (e) { return null } }
function save() { if (AUD) return; try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) { } }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const safeSrc = u => /^(data:image\/|https:\/\/)/.test(u || "") ? u : "";

/* ---------- 選手の読み込み ---------- */
function normalize(list) {
  return list.map((p, i) => ({
    id: "r" + (p.row ?? i),
    name: String(p.name || "").trim(),
    icon: safeSrc(p.icon),
    weapons: (p.weapons || []).map(w => String(w).trim()).filter(Boolean).slice(0, 3),
    pr: String(p.pr || "").trim()
  })).filter(p => p.name);
}
function readCache() { try { return JSON.parse(localStorage.getItem(ROSTER_KEY) || "null") } catch (e) { return null } }
function writeCache(players, at) { try { localStorage.setItem(ROSTER_KEY, JSON.stringify({ players, at })) } catch (e) { } }

/* 読み込み方法は2通り
   ・HTMLファイルを開いた場合：API_URL（ウェブアプリ）から JSON を取得
   ・Apps Script のウェブアプリとして開いた場合：google.script.run で直接取得（将来のデプロイ方式用） */
const onAppsScript = () => typeof google !== "undefined" && google.script && google.script.run;
function fetchPlayers() {
  if (onAppsScript()) {
    return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getPlayers());
  }
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 20000);
  return fetch(API_URL, { signal: ctl.signal, cache: "no-store" })
    .then(res => { clearTimeout(timer); if (!res.ok) throw new Error("HTTP " + res.status); return res.json() });
}

async function loadRoster() {
  if (!onAppsScript() && !API_URL) {
    roster = SAMPLE_ROSTER;
    rosterState = { kind: "sample", msg: "API_URL が未設定のため、サンプル選手を表示しています。" };
    return render();
  }
  const cache = readCache();
  if (cache && !roster.length) roster = cache.players;
  rosterState = { kind: "loading", msg: "スプレッドシートから選手を読み込んでいます…" };
  render();
  try {
    const body = await fetchPlayers();
    if (!body || !Array.isArray(body.players)) throw new Error("形式が違います");
    roster = normalize(body.players);
    rosterState = { kind: "live", msg: `スプレッドシートから ${roster.length} 人を読み込みました。`, at: body.updatedAt || new Date().toISOString() };
    writeCache(roster, rosterState.at);
  } catch (e) {
    if (cache) {
      roster = cache.players;
      rosterState = { kind: "warn", msg: `スプレッドシートに接続できなかったため、前回の内容（${fmtTime(cache.at)}時点）を表示しています。`, at: cache.at };
    } else {
      roster = SAMPLE_ROSTER;
      rosterState = { kind: "warn", msg: "スプレッドシートに接続できなかったため、サンプル選手を表示しています。API_URL と、ウェブアプリのアクセス設定（全員）を確認してください。" };
    }
  }
  render();
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function manualPlayers() {
  return S.manualText.split(/\n/).map(l => l.trim()).filter(Boolean).map((l, i) => {
    const m = l.split(/\s*[\/／,，、]\s*/);
    return { id: "m" + i, name: m[0], icon: "", weapons: m.slice(1, 4).filter(Boolean), pr: "" };
  });
}
function currentPlayers() { return S.source === "manual" ? manualPlayers() : roster }

/* ---------- 部品 ---------- */
function avatar(p, size) {
  const src = safeSrc(p.icon);
  return `<span class="av ${size}">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : esc([...(p.name || "?")][0])}</span>`;
}
function kitImg(src, label) {
  return src ? `<img class="kit" src="${src}" alt="${esc(label)}" title="${esc(label)}">` : "";
}
function weaponRows(p) {
  if (!p.weapons || !p.weapons.length) return '<p class="wnone">使用武器の登録なし</p>';
  return `<div class="wlist">${p.weapons.map(n => {
    const w = weaponOf(n);
    if (!w.known) return `<div class="wrow"><span></span><span class="wn">${esc(n)}<small>武器データにない名前です</small></span><span></span></div>`;
    return `<div class="wrow"><img class="wi" src="${w.img}" alt=""><span class="wn">${esc(n)}<small>${esc(w.type)}</small></span>
      <span class="ks">${kitImg(w.subImg, "サブ：" + w.sub)}${kitImg(w.spImg, "スペシャル：" + w.sp)}</span></div>`;
  }).join("")}</div>`;
}
function weaponChips(p) {
  if (!p.weapons || !p.weapons.length) return '<span class="wnone">登録なし</span>';
  return p.weapons.map(n => {
    const w = weaponOf(n);
    if (!w.known) return `<span class="wchip unk" title="武器データにない名前です">${esc(n)}</span>`;
    return `<span class="wchip"><img class="wi" src="${w.img}" alt=""><span class="wn">${esc(n)}</span>${kitImg(w.subImg, "サブ：" + w.sub)}${kitImg(w.spImg, "スペシャル：" + w.sp)}</span>`;
  }).join("");
}
function weaponMini(p) {
  if (!p.weapons || !p.weapons.length) return "";
  return `<span class="mini">${p.weapons.map(n => {
    const w = weaponOf(n);
    if (!w.known) return `<span class="mw" title="${esc(n)}">${esc(n)}</span>`;
    return `<span class="mw" title="${esc(n)}（${esc(w.sub)}／${esc(w.sp)}）"><img class="wi" src="${w.img}" alt="${esc(n)}">${kitImg(w.subImg, w.sub)}${kitImg(w.spImg, w.sp)}</span>`;
  }).join("")}</span>`;
}

/* ---------- 指名順 ---------- */
function totalPicks() { return Math.min(S.teams.length * (S.teamSize - 1), S.pool.length) }
function teamAt(k) { const n = S.teams.length, r = Math.floor(k / n), p = k % n; return S.mode === "snake" && r % 2 === 1 ? n - 1 - p : p }
function membersOf(ti) { return S.picks.filter(p => p.team === ti).map(p => S.pool.find(x => x.id === p.player)) }
function available() { const t = new Set(S.picks.map(p => p.player)); return S.pool.filter(p => !t.has(p.id)) }
function isDone() { return S.picks.length >= totalPicks() }
function setPhase(ph) { ["setup", "draft", "done"].forEach(k => $("ph-" + k).className = k === ph ? "on" : "") }
function setFacts(items) { $("facts").innerHTML = items.map(([n, l]) => `<div class="fact"><span class="n">${n}</span><span class="l">${l}</span></div>`).join("") }
function ensureTeams() {
  while (S.setupTeams.length < S.teamCount) {
    const used = S.setupTeams.map(t => t.color); const c = COLORS.findIndex((_, i) => !used.includes(i));
    S.setupTeams.push({ name: "チーム" + LETTERS[S.setupTeams.length], captain: "", color: c < 0 ? 0 : c });
  }
  S.setupTeams.length = S.teamCount;
}

/* ---------- 準備 ---------- */
function renderSetup() {
  if (AUD) return renderAudienceSetup();
  ensureTeams(); setPhase("setup");
  $("headActions").innerHTML = "";
  $("heroEyebrow").textContent = "TEAM DRAFT";
  $("heroTitle").innerHTML = "キャプテンが、<em>順番に</em>選ぶ。";
  $("heroSub").textContent = "出場選手を確認して、チーム数とキャプテンを決めたら開始します。";
  const players = currentPlayers();
  const caps = new Set(S.setupTeams.map(t => t.captain.trim()).filter(Boolean));
  setFacts([[players.length, "人が出場"], [S.teamCount, "チーム"], [S.teamSize, "人 / チーム"], [MODE_LABEL[S.mode], "指名方式"]]);

  const st = rosterState;
  const stCls = st.kind === "live" ? "live" : st.kind === "loading" ? "load" : "warn";
  const rosterHtml = S.source === "manual"
    ? `<div class="field"><p class="h4">指名される選手（1行に1人）</p>
        <textarea id="manual" placeholder="名前 / 武器1 / 武器2 / 武器3" aria-label="指名される選手">${esc(S.manualText)}</textarea>
        <p class="hint">「名前 / 武器1 / 武器2 / 武器3」の形で書くと、武器の画像も表示されます。キャプテンも含めて入れてください。</p></div>`
    : (players.length
      ? `<div class="plist" role="table" aria-label="出場選手">
          <div class="prow phd" role="row"><span role="columnheader">No.</span><span role="columnheader">選手</span><span role="columnheader">使用武器</span><span role="columnheader">自己PR</span></div>
          ${players.map((p, i) => `
          <div class="prow ${caps.has(p.name) ? "cap" : ""}" role="row" data-name="${esc(p.name)}">
            <span class="pno" role="cell">${i + 1}</span>
            <span class="pwho" role="cell">${avatar(p, "m")}<span class="pn">${caps.has(p.name) ? "<small>CAPTAIN</small>" : ""}${esc(p.name)}</span></span>
            <span class="pweap" role="cell">${weaponChips(p)}</span>
            <span class="ppr" role="cell">${p.pr ? esc(p.pr) : '<span class="wnone">—</span>'}</span>
          </div>`).join("")}
        </div>`
      : `<p class="note">スプレッドシートに選手がまだ登録されていません。<b>選手名</b>を入れた行が、ここに表示されます。</p>`);

  const teamRows = S.setupTeams.map((t, i) => `
    <div class="team-row">
      <button class="swatch" data-sw="${i}" style="background:${COLORS[t.color].bg}" aria-label="${esc(t.name)}の色を変更（いまは${COLORS[t.color].n}）" title="クリックで色を変更"></button>
      <input type="text" id="tn${i}" data-tn="${i}" value="${esc(t.name)}" placeholder="チーム名" aria-label="チーム名">
      <input type="text" id="tc${i}" data-tc="${i}" value="${esc(t.captain)}" placeholder="キャプテン名" aria-label="${esc(t.name)}のキャプテン" list="playerNames">
    </div>`).join("");
  const segBtns = (key, vals, cur, fmt) => vals.map(v => `<button class="chip" data-${key}="${v}" aria-pressed="${v == cur}">${fmt(v)}</button>`).join("");

  $("app").innerHTML = `
  <section class="panel">
    <div class="panel-head">
      <h2>出場選手</h2>
      <div class="seg">
        <div class="seg" role="group" aria-label="選手の入力元">${segBtns("src", ["sheet", "manual"], S.source, v => v === "sheet" ? "スプレッドシート" : "手入力")}</div>
        ${S.source === "sheet" ? '<button class="more sm" id="reload">再読み込み</button>' : ""}
      </div>
    </div>
    ${S.source === "sheet" ? `<p class="status ${stCls}"><span class="dot"></span>${esc(st.msg)}</p>` : ""}
    ${rosterHtml}
  </section>

  <section class="panel" style="margin-top:24px">
    <div class="panel-head"><h2>ドラフトの準備</h2></div>
    <div class="opts">
      <div class="seg" role="group" aria-label="チーム数"><span class="lab">チーム数</span>${segBtns("tcount", [2, 3, 4, 5, 6, 7, 8], S.teamCount, v => v)}</div>
      <div class="seg" role="group" aria-label="1チームの人数"><span class="lab">人数</span>${segBtns("tsize", [3, 4, 5, 6], S.teamSize, v => v + "人")}</div>
      <div class="seg" role="group" aria-label="指名方式"><span class="lab">方式</span>${segBtns("mode", ["simul", "snake", "linear"], S.mode, v => v === "simul" ? "同時指名（重複は抽選）" : v === "snake" ? "スネーク" : "毎巡同じ順")}</div>
      ${S.mode === "simul" ? `<label class="check"><input type="checkbox" id="hide" ${S.hide ? "checked" : ""}>発表まで指名を隠す</label>` : `<label class="check"><input type="checkbox" id="shuffle" ${S.shuffle ? "checked" : ""}>指名順をくじで決める</label>`}
    </div>
    <p class="hint">${MODE_HINT[S.mode]}</p>
    <div class="field"><p class="h4">チームとキャプテン（上から指名順）</p>
      <div class="team-rows" style="max-width:640px">${teamRows}</div>
      <datalist id="playerNames">${players.map(p => `<option value="${esc(p.name)}">`).join("")}</datalist>
      <p class="hint">キャプテン名は出場選手から選べます。キャプテンは指名の対象から外れます。色の丸をクリックするとチームカラーが変わります。</p>
    </div>
    <div class="panel-head">
      <p class="error" id="err"></p>
      <button class="more primary" id="start">ドラフト開始</button>
    </div>
  </section>`;

  document.querySelectorAll("[data-src]").forEach(b => b.onclick = () => { S.source = b.dataset.src; save(); render() });
  if ($("reload")) $("reload").onclick = loadRoster;
  if ($("manual")) $("manual").oninput = e => { S.manualText = e.target.value; save(); const f = document.querySelector("#facts .n"); if (f) f.textContent = manualPlayers().length };
  document.querySelectorAll("[data-tcount]").forEach(b => b.onclick = () => { S.teamCount = +b.dataset.tcount; save(); render() });
  document.querySelectorAll("[data-tsize]").forEach(b => b.onclick = () => { S.teamSize = +b.dataset.tsize; save(); render() });
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { S.mode = b.dataset.mode; save(); render() });
  if ($("shuffle")) $("shuffle").onchange = e => { S.shuffle = e.target.checked; save() };
  if ($("hide")) $("hide").onchange = e => { S.hide = e.target.checked; save() };
  document.querySelectorAll("[data-tn]").forEach(el => el.oninput = e => { S.setupTeams[+el.dataset.tn].name = e.target.value; save() });
  document.querySelectorAll("[data-tc]").forEach(el => {
    el.oninput = e => { S.setupTeams[+el.dataset.tc].captain = e.target.value; save() };
    el.onchange = refreshCaps;
  });
  document.querySelectorAll("[data-sw]").forEach(el => el.onclick = () => { const t = S.setupTeams[+el.dataset.sw]; t.color = (t.color + 1) % COLORS.length; save(); render() });
  $("start").onclick = startDraft;
}

/* キャプテン表示だけを更新（全体を描き直すと、直後の「ドラフト開始」のクリックが消えるため） */
function refreshCaps() {
  const caps = new Set(S.setupTeams.map(t => t.captain.trim()).filter(Boolean));
  document.querySelectorAll(".prow[data-name]").forEach(r => {
    const on = caps.has(r.dataset.name); r.classList.toggle("cap", on);
    const pn = r.querySelector(".pn"); const sm = pn && pn.querySelector("small");
    if (on && !sm) pn.insertAdjacentHTML("afterbegin", "<small>CAPTAIN</small>");
    if (!on && sm) sm.remove();
  });
}
function startDraft() {
  const err = $("err");
  const players = currentPlayers();
  const byName = new Map(players.map(p => [p.name, p]));
  const teams = S.setupTeams.map(t => {
    const name = t.captain.trim();
    const p = byName.get(name);
    return { name: t.name.trim() || "チーム", color: t.color, captain: p ? { ...p } : { id: "c-" + name, name, icon: "", weapons: [], pr: "" } };
  });
  if (teams.some(t => !t.captain.name)) { err.textContent = "すべてのチームにキャプテン名を入れてください。"; return }
  const caps = teams.map(t => t.captain.name);
  if (new Set(caps).size !== caps.length) { err.textContent = "キャプテン名が重複しています。別の選手にしてください。"; return }
  const seen = new Set(caps), pool = [];
  for (const p of players) { if (seen.has(p.name)) continue; seen.add(p.name); pool.push({ ...p }) }
  if (!pool.length) { err.textContent = "指名される選手がいません。出場選手を確認してください。"; return }
  if (S.shuffle && S.mode !== "simul") { for (let i = teams.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[teams[i], teams[j]] = [teams[j], teams[i]] } }
  Object.assign(S, { phase: "draft", teams, pool, picks: [] });
  if (S.mode === "simul") initSimul();
  save(); render(); window.scrollTo({ top: 0 });
}

/* ---------- ドラフト ---------- */
function renderDraft() {
  const done = isDone(), total = totalPicks(), n = S.teams.length;
  const cur = done ? -1 : teamAt(S.picks.length);
  const ct = cur >= 0 ? COLORS[S.teams[cur].color] : null;
  const round = Math.floor(S.picks.length / n) + 1;
  const avail = available();

  setPhase(done ? "done" : "draft");
  $("headActions").innerHTML = `
    <button class="more sm" id="undo" ${S.picks.length ? "" : "disabled"}>ひとつ戻す</button>
    <button class="more sm ${resetArmed ? "armed" : ""}" id="reset">${resetArmed ? "もう一度押すと準備に戻る" : "準備に戻る"}</button>`;
  $("heroEyebrow").textContent = done ? "DRAFT COMPLETE" : `ROUND ${round}`;
  $("heroTitle").innerHTML = done ? "チームが<em>決まりました</em>。" : `いま選ぶのは、<em>${esc(S.teams[cur].name)}</em>。`;
  $("heroSub").textContent = done ? "下の結果をコピーして共有できます。" : "選手カードをタップすると、指名中のチームに入ります。";
  setFacts([[n, "チーム"], [S.picks.length + " / " + total, "指名済み"], [avail.length, "人が残り"], [MODE_LABEL[S.mode], "指名方式"]]);

  let strip = "";
  for (let k = 0; k < total; k++) {
    if (k > 0 && k % n === 0) strip += '<span class="sep"></span>';
    const t = S.teams[teamAt(k)], c = COLORS[t.color];
    strip += `<span class="tick ${k < S.picks.length ? "done" : ""} ${k === S.picks.length ? "now" : ""}" style="background:${c.bg};color:${c.fg}" title="${k + 1}位指名：${esc(t.name)}">${k + 1}</span>`;
  }
  const banner = done
    ? `<div class="clock" style="background:var(--accent);color:var(--accent-ink)">
        <div class="who"><small>DRAFT COMPLETE</small><strong>ドラフト完了</strong></div>
        <div class="count">${S.picks.length}<small>人を指名</small></div></div>`
    : `<div class="clock" style="background:${ct.bg};color:${ct.fg}">
        <div class="who"><small>第${round}巡 ・ 指名中</small><strong>${esc(S.teams[cur].name)}（${esc(S.teams[cur].captain.name)}）</strong></div>
        <div class="count">${S.picks.length + 1}<small>/ ${total} 位指名</small></div></div>`;

  const poolHtml = avail.length
    ? `<div class="pool cards">${avail.map(p => `
        <button class="pick card2" data-pick="${p.id}" ${done ? "disabled" : ""} style="--hov:${ct ? ct.bg : "var(--accent)"}">
          <span class="top">${avatar(p, "m")}<b>${esc(p.name)}</b></span>
          ${weaponMini(p)}
          ${p.pr ? `<span class="pr clamp">${esc(p.pr)}</span>` : ""}
        </button>`).join("")}</div>`
    : '<p class="hint">全員が指名されました。</p>';

  const teamsHtml = S.teams.map((t, i) => {
    const c = COLORS[t.color], mem = membersOf(i);
    let rows = `<li>${avatar(t.captain, "s")}<span class="nm">${esc(t.captain.name)}</span><span class="cap">C</span>${weaponMini(t.captain)}</li>`;
    S.picks.forEach((pk, k) => {
      if (pk.team !== i) return; const m = S.pool.find(x => x.id === pk.player);
      rows += `<li class="${lastPick === pk.player ? "new" : ""}">${avatar(m, "s")}<span class="nm">${esc(m.name)}</span><span class="no">${k + 1}位</span>${weaponMini(m)}</li>`;
    });
    for (let j = mem.length + 1; j < S.teamSize; j++) rows += `<li class="empty"><span class="av s">—</span><span class="nm">未指名</span></li>`;
    return `<div class="team ${i === cur ? "on" : ""}" style="--tc:${c.bg}">
      <h3 style="background:${c.bg};color:${c.fg}">${esc(t.name)}<small>${mem.length + 1}/${S.teamSize}</small></h3>
      <ol>${rows}</ol></div>`;
  }).join("");

  const resultBlock = done ? `
    <section class="panel" style="margin-top:24px">
      <div class="panel-head">
        <h2>結果</h2>
        <div class="seg"><span class="toast" id="toast">${toastMsg}</span><button class="more sm primary" id="copy">テキストをコピー</button></div>
      </div>
      <pre class="result" id="resultText">${esc(resultText())}</pre>
    </section>` : "";

  $("app").innerHTML = `
    ${banner}
    <div class="strip" aria-label="指名順">${strip}</div>
    <div class="board">
      <section class="panel">
        <div class="panel-head">
          <h2>選手プール</h2>
          <button class="chip" id="rand" ${done || !avail.length ? "disabled" : ""}>ランダム指名</button>
        </div>
        ${poolHtml}
        ${!done ? '<p class="hint">間違えて指名したら、上の「ひとつ戻す」で取り消せます。</p>' : ""}
      </section>
      <section class="teams" aria-label="チーム">${teamsHtml}</section>
    </div>
    ${resultBlock}`;

  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pick(b.dataset.pick));
  $("rand").onclick = () => { const a = available(); if (a.length) pick(a[Math.floor(Math.random() * a.length)].id) };
  $("undo").onclick = () => { S.picks.pop(); lastPick = null; resetArmed = false; save(); render() };
  $("reset").onclick = () => {
    if (!resetArmed) { resetArmed = true; render(); setTimeout(() => { if (resetArmed) { resetArmed = false; render() } }, 3000); return }
    resetArmed = false; S.phase = "setup"; S.picks = []; save(); render();
  };
  if ($("copy")) $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(resultText()); toastMsg = "コピーしました" }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("resultText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toastMsg = "選択しました。Ctrl+C でコピーしてください" }

function pick(id) {
  if (isDone()) return;
  S.picks.push({ team: teamAt(S.picks.length), player: id });
  lastPick = id; resetArmed = false; save(); render();
}

function resultText() {
  const wtxt = p => p.weapons && p.weapons.length ? `（${p.weapons.join("・")}）` : "";
  const lines = S.teams.map((t, i) => {
    const m = S.picks.filter(pk => pk.team === i).map(pk => { const p = S.pool.find(x => x.id === pk.player);
      return `・${p.name}${wtxt(p)}${pk.lottery ? "　※抽選" : ""}` });
    return `【${t.name}】\n・${t.captain.name}［キャプテン］${wtxt(t.captain)}${m.length ? "\n" + m.join("\n") : ""}`;

/* ===================== 同時指名（重複は抽選） ===================== */
const MODE_LABEL = { simul: "同時指名", snake: "スネーク", linear: "同順" };
const MODE_HINT = {
  simul: "同時指名：各巡で全チームが一斉に1人ずつ指名します。指名が重なった選手はスロット抽選で交渉権を決め、外れたチームはまだ残っている選手から指名し直します。「発表まで指名を隠す」をオンにすると、観客用画面には発表まで誰を指名したか表示されません。",
  snake: "スネーク：A→B→B→A→A→B…と巡ごとに順番が折り返します。最後に選んだチームが次の巡で先に選べるので、戦力が偏りにくい方式です。",
  linear: "毎巡同じ順：どの巡も A→B→C… の同じ順番で1人ずつ指名します。"
};
function rand(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n }
function teamFull(i) { return membersOf(i).length + 1 >= S.teamSize }
function pickedThisRound(i) { return S.picks.some(p => p.team === i && p.round === S.round) }
function pendingTeams() { return S.teams.map((_, i) => i).filter(i => !teamFull(i) && !pickedThisRound(i)) }
function snapshot() {
  S.history = S.history || [];
  S.history.push(JSON.stringify({ picks: S.picks, round: S.round, attempt: S.attempt, stage: S.stage, noms: S.noms, lotteries: S.lotteries, active: S.active, annOrder: S.annOrder, annIdx: S.annIdx }));
  if (S.history.length > 300) S.history.shift();
}
function undoSimul() {
  const h = (S.history || []).pop(); if (!h) return;
  Object.assign(S, JSON.parse(h)); lastPick = null; save(); render();
}
function initSimul() {
  Object.assign(S, { round: 1, attempt: 1, stage: "nominate", noms: {}, lotteries: [], history: [] });
  nextRoundIfNeeded();
  S.active = pendingTeams()[0] ?? -1;
}
function simulDone() { return !available().length || S.teams.every((_, i) => teamFull(i)) }
function nextRoundIfNeeded() {
  while (!simulDone() && !pendingTeams().length) { S.round++; S.attempt = 1 }
  if (simulDone()) S.stage = "done";
}
function nominate(pid) {
  if (S.stage !== "nominate" || S.active < 0) return;
  snapshot();
  if (S.noms[S.active] === pid) delete S.noms[S.active];
  else S.noms[S.active] = pid;
  const next = pendingTeams().find(i => S.noms[i] == null);
  if (next != null && S.noms[S.active] != null) S.active = next;
  save(); render();
}
function startAnnounce() {
  const pend = pendingTeams();
  if (!pend.length || pend.some(i => S.noms[i] == null)) return;
  snapshot();
  S.stage = "announce"; S.annOrder = pend; S.annIdx = 0;
  save(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
}
let annSeen = null;
function announceNext() {
  if (S.annIdx >= S.annOrder.length) return;
  snapshot(); S.annIdx++; save(); render();
}
function reveal() {
  const pend = pendingTeams();
  if (pend.some(i => S.noms[i] == null)) return;
  snapshot();
  const by = {};
  pend.forEach(i => (by[S.noms[i]] = by[S.noms[i]] || []).push(i));
  S.lotteries = [];
  for (const [pid, teams] of Object.entries(by)) {
    if (teams.length === 1) S.picks.push({ team: teams[0], player: pid, round: S.round, attempt: S.attempt, lottery: false });
    else S.lotteries.push({ player: pid, teams, winner: null });
  }
  S.stage = S.lotteries.length ? "lottery" : "nominate";
  if (!S.lotteries.length) afterStage();
  save(); render();
}
function setWinner(li, team) {
  snapshot();
  S.lotteries[li].winner = team; save(); render();
}
const SLOT_H = 64, SLOT_CYCLES = 34, SPIN_MS = 10000;
const isSpinning = () => (S.lotteries || []).some(l => l.spinAt && l.winner == null);
const spinTimers = {};
function spin(li) {
  const L = S.lotteries[li]; if (AUD || !L || L.winner != null || isSpinning()) return;
  const n = L.teams.length, idx = rand(n);
  L.slotIdx = SLOT_CYCLES * n + idx; L.pend = L.teams[idx];
  L.spinAt = matchMedia("(prefers-reduced-motion: reduce)").matches ? Date.now() - SPIN_MS : Date.now();
  save(); render();
}
function finishSpin(li) {
  const L = S.lotteries[li]; if (!L || L.winner != null || !L.spinAt) return;
  const w = L.pend; delete L.spinAt; delete L.pend; delete spinTimers[li];
  setWinner(li, w);
}
/* 描画後：回転中のリールを、残り時間に合わせて最終位置まで動かす（運営用・観客用どちらも） */
function runSpins() {
  document.querySelectorAll("[data-reel][data-spinat]").forEach(el => {
    const left = SPIN_MS - (Date.now() - +el.dataset.spinat), y = `translateY(${-(+el.dataset.target - 1) * SLOT_H}px)`;
    if (left < 400) { el.style.transform = y; return }
    el.closest(".slot").classList.add("run");
    el.style.transition = `transform ${left - 300}ms cubic-bezier(.12,.74,.14,1.01)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transform = y }));
  });
  if (AUD) return;
  (S.lotteries || []).forEach((l, li) => {
    if (!l.spinAt || l.winner != null || spinTimers[li]) return;
    spinTimers[li] = setTimeout(() => finishSpin(li), Math.max(0, SPIN_MS - (Date.now() - l.spinAt)));
  });
}
function slotHTML(l, li) {
  const n = l.teams.length, total = (SLOT_CYCLES + 2) * n;
  const spinningNow = l.spinAt && l.winner == null;
  const center = l.winner != null ? l.slotIdx : n;
  const rows = Array.from({ length: total }, (_, k) => {
    const ti = l.teams[k % n], t = S.teams[ti], c = COLORS[t.color];
    const cls = l.winner == null ? "" : k === center ? "w" : "l";
    return `<div class="srow ${cls}" style="--tc:${c.bg};--tf:${c.fg}">${esc(t.name)}<small>${esc(t.captain.name)}</small></div>`;
  }).join("");
  return `<div class="slot ${l.winner != null ? "stopped" : ""}" aria-label="抽選スロット">
    <div class="reel" data-reel="${li}" ${spinningNow ? `data-spinat="${l.spinAt}" data-target="${l.slotIdx}"` : ""} style="transform:translateY(${-(center - 1) * SLOT_H}px)">${rows}</div>
    <div class="slot-line"></div></div>`;
}
function confirmLotteries() {
  if (S.lotteries.some(l => l.winner == null)) return;

}

  $("undo").onclick = () => { resetArmed = false; undoSimul() };
  $("reset").onclick = () => {
    if (!resetArmed) { resetArmed = true; render(); setTimeout(() => { if (resetArmed) { resetArmed = false; render() } }, 3000); return }
    resetArmed = false; S.phase = "setup"; S.picks = []; save(); render();
  };
  if ($("copy")) $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(resultText()); toastMsg = "コピーしました" }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("resultText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toastMsg = "選択しました。Ctrl+C でコピーしてください" }
    $("toast").textContent = toastMsg; setTimeout(() => { toastMsg = ""; const t = $("toast"); if (t) t.textContent = "" }, 2500);
  };
}

/* ===================== 観客用画面（配信用） ===================== */
function renderAudienceSetup() {
  setPhase("setup");
  $("headActions").innerHTML = "";
  $("heroEyebrow").textContent = "TEAM DRAFT";
  $("heroTitle").innerHTML = "まもなく、<em>ドラフト</em>開始。";
  $("heroSub").textContent = "出場選手とキャプテンを紹介します。";
  const players = currentPlayers();
  const caps = new Set(S.setupTeams.map(t => t.captain.trim()).filter(Boolean));
  setFacts([[players.length, "人が出場"], [S.teamCount, "チーム"], [S.teamSize, "人 / チーム"], [MODE_LABEL[S.mode], "指名方式"]]);
  const teams = S.setupTeams.slice(0, S.teamCount).map(t => { const c = COLORS[t.color];
    return `<span class="nomchip" style="--tc:${c.bg};--tf:${c.fg}"><span class="sw"></span>${esc(t.name)}<b>${t.captain.trim() ? esc(t.captain) : "キャプテン未定"}</b></span>` }).join("");
  $("app").innerHTML = `
    <section class="panel"><div class="panel-head"><h2>チームとキャプテン</h2></div><div class="nomrow" style="margin:0">${teams}</div></section>
    <section class="panel" style="margin-top:24px"><div class="panel-head"><h2>出場選手</h2></div>
      ${players.length ? `<div class="plist" role="table" aria-label="出場選手">
        <div class="prow phd" role="row"><span role="columnheader">No.</span><span role="columnheader">選手</span><span role="columnheader">使用武器</span><span role="columnheader">自己PR</span></div>
        ${players.map((p, i) => `<div class="prow ${caps.has(p.name) ? "cap" : ""}" role="row">
          <span class="pno" role="cell">${i + 1}</span>
          <span class="pwho" role="cell">${avatar(p, "m")}<span class="pn">${caps.has(p.name) ? "<small>CAPTAIN</small>" : ""}${esc(p.name)}</span></span>
          <span class="pweap" role="cell">${weaponChips(p)}</span>
          <span class="ppr" role="cell">${p.pr ? esc(p.pr) : '<span class="wnone">—</span>'}</span></div>`).join("")}</div>`
      : '<p class="hint">出場選手を読み込んでいます…</p>'}
    </section>`;
}
function openAudience() {
  const url = location.href.split("#")[0] + "#audience";
  const w = window.open(url, "splat-draft-audience", "width=1280,height=860");
  if (!w) alertBox("ポップアップがブロックされました。ブラウザのアドレスバーで、ポップアップを許可してください。");
}
function alertBox(msg) {
  const d = document.createElement("p"); d.className = "note"; d.style.marginTop = "12px"; d.textContent = msg;
  $("app").prepend(d); setTimeout(() => d.remove(), 6000);
}

function render() {
  document.body.classList.toggle("drafting", S.phase === "draft");
  S.phase !== "draft" ? renderSetup() : S.mode === "simul" ? renderSimul() : renderDraft();
  if (!AUD) {
    $("headActions").insertAdjacentHTML("afterbegin", '<button class="more sm aud-btn" id="openAud" title="配信ではこの画面を共有してください">観客用画面を開く</button>');
    $("openAud").onclick = openAudience;
  }
  const st = rosterState;
  $("footStatus").textContent = S.source === "manual" ? "出場選手：手入力" : (st.kind === "live" ? `出場選手：スプレッドシート（${fmtTime(st.at)} 読み込み）` : `出場選手：${st.msg}`);
}

/* 観客用画面では、発表まで指名を伏せるのを既定にする */
if (S.hide === undefined) S.hide = true;
/* 以前の保存（スネーク既定）からは同時指名を既定にする */
if (!S.v3) { S.v3 = true; if (S.phase !== "draft") S.mode = "simul"; save() }
/* 古い保存形式（キャプテンが文字列）のドラフトは準備からやり直す */
if (S.phase === "draft" && S.teams && typeof S.teams[0]?.captain === "string") { S.phase = "setup"; save() }
if (AUD) {
  document.body.classList.add("aud");
  document.title = "スプラドラフト会議（観客用）";
  /* 運営用画面が保存した状態を読み取って表示し直す */
  let raw = null; try { raw = localStorage.getItem(KEY) } catch (e) { }
  const pull = () => {
    let v = null; try { v = localStorage.getItem(KEY) } catch (e) { return }
    if (!v || v === raw) return;
    raw = v; try { S = JSON.parse(v) } catch (e) { return }
    render();
  };
  addEventListener("storage", e => { if (e.key === KEY) pull() });
  setInterval(pull, 300);
}
render();
loadRoster();
</script>

</body>
</html>
